# devloop configuration (docs/DEVELOPMENT.md §4). Read at every cycle, so edits apply live.

claude_bin = "claude"          # Claude Code CLI on PATH (or an absolute path)
base_branch = "main"           # agents branch from here; `devloop accept` merges here
current_milestone = "M1"       # the planner proposes tasks for this milestone
worktrees_dir = "../langtype-worktrees"
check_command = "just check"   # run by `devloop accept` before merging

max_concurrent = 2
max_runs_per_day = 40
max_tokens_per_day = 0         # 0 = no cap (Claude's own usage limit still pauses the loop)
max_usage_percent = 70         # stop at 70% of any Claude usage window (5-hour, 7-day), account-wide:
                               # no new runs above it, and a running agent is stopped when it crosses it
max_turns_per_run = 80
run_timeout_minutes = 60
max_fix_attempts = 3
poll_seconds = 120
quiet_hours = []               # e.g. ["09:00-17:00"]: no new runs during these local times

# Pull requests (docs/DEVELOPMENT.md §3a). devloop pushes reviewed task branches and opens PRs
# with the agent's description and validation screenshots; agents never push.
pull_requests = false          # turn on once `main` is on GitHub and `gh auth status` is fine
remote = "origin"
assets_branch = "devloop-assets"   # where screenshots are stored so PRs can show them
gh_bin = "gh"
